server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

spring:
  application:
    name: xinglin-user-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:xinglin_video}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.MySQL8Dialect
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:xinglin}
    password: ${RABBITMQ_PASSWORD:xinglin}
    listener:
      simple:
        acknowledge-mode: auto
        retry:
          enabled: true
          max-attempts: 3

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

xinglin:
  seed:
    demo-user-enabled: ${DEMO_USER_ENABLED:true}
    demo-username: ${DEMO_USERNAME:student001}
    demo-password: ${DEMO_PASSWORD:abc123456}
    demo-phone: ${DEMO_PHONE:13800000000}
    demo-nickname: ${DEMO_NICKNAME:杏林学子}
    admin-username: ${ADMIN_USERNAME:yjyjocyer}
    admin-password: ${ADMIN_PASSWORD:}
    admin-phone: ${ADMIN_PHONE:13900000000}
  auth:
    jwt-secret: ${JWT_SECRET:change_this_dev_secret_at_least_32_chars}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL_SECONDS:7200}
    refresh-token-ttl-days: ${REFRESH_TOKEN_TTL_DAYS:7}
  security:
    bcrypt-strength: ${BCRYPT_STRENGTH:10}
    login-max-failures: ${LOGIN_MAX_FAILURES:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    register-ip-max-per-hour: ${REGISTER_IP_MAX_PER_HOUR:20}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-},%X{userId:-}] %logger{36} - %msg%n"
  level:
    com.xinglin.user: INFO
