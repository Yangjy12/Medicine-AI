server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: xinglin-video-service
  servlet:
    multipart:
      max-file-size: ${UPLOAD_MAX_FILE_SIZE:1024MB}
      max-request-size: ${UPLOAD_MAX_REQUEST_SIZE:1024MB}
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:xinglin_video}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout: 2s
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
    connection-timeout: 2s
    socket-timeout: 3s
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:xinglin}
    password: ${RABBITMQ_PASSWORD:xinglin}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-},%X{userId:-}] %logger{36} - %msg%n"
  level:
    com.xinglin.video: INFO
    org.hibernate.SQL: WARN

xinglin:
  auth:
    jwt-secret: ${JWT_SECRET:change_this_dev_secret_at_least_32_chars}
  video:
    page-size-max: 50
    finish-threshold-percent: 90
    effective-play-seconds: 10
    play-dedup-minutes: 30
  elasticsearch:
    enabled: ${ES_ENABLED:true}
    index-name: ${ES_VIDEO_INDEX:xinglin_video}
  oss:
    enabled: ${OSS_ENABLED:false}
    endpoint: ${OSS_ENDPOINT:}
    public-endpoint: ${OSS_PUBLIC_ENDPOINT:}
    public-base-url: ${OSS_PUBLIC_BASE_URL:}
    bucket: ${OSS_BUCKET:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    video-dir: ${OSS_VIDEO_DIR:videos}
    cover-dir: ${OSS_COVER_DIR:covers}
    max-video-size-mb: ${OSS_MAX_VIDEO_SIZE_MB:1024}
    max-cover-size-mb: ${OSS_MAX_COVER_SIZE_MB:10}
