version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: xinglin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xinglin_mysql_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xinglin_video}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - xinglin-net

  redis:
    image: redis:7
    container_name: xinglin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-xinglin_redis_pwd}
    volumes:
      - ./data/redis:/data
    networks:
      - xinglin-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: xinglin-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-xinglin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-xinglin_rabbit_pwd}
      TZ: Asia/Shanghai
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    networks:
      - xinglin-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.26
    container_name: xinglin-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    volumes:
      - ./data/es:/usr/share/elasticsearch/data
    networks:
      - xinglin-net

  video-service:
    build:
      context: ./backend/video-service
    image: xinglin/video-service:1.0.0
    container_name: xinglin-video-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - rabbitmq
    environment:
      SERVER_PORT: 8082
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xinglin_video}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xinglin_mysql_pwd}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-xinglin_redis_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-xinglin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-xinglin_rabbit_pwd}
      TZ: Asia/Shanghai
    networks:
      - xinglin-net

  frontend:
    image: nginx:1.25-alpine
    container_name: xinglin-frontend
    restart: unless-stopped
    depends_on:
      - video-service
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/media:/data/media:ro
    ports:
      - "80:80"
    networks:
      - xinglin-net

networks:
  xinglin-net:
    driver: bridge
