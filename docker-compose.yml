services:
  mysql:
    image: mysql:8.0
    container_name: xinglin-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xinglin_mysql_pwd}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xinglin_video}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
    networks:
      - xinglin-net

  redis:
    image: redis:7
    container_name: xinglin-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-xinglin_redis_pwd}
    volumes:
      - ./data/redis:/data
    networks:
      - xinglin-net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: xinglin-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-xinglin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-xinglin_rabbit_pwd}
      TZ: Asia/Shanghai
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
    networks:
      - xinglin-net

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.26
    container_name: xinglin-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      TZ: Asia/Shanghai
    volumes:
      - ./data/es:/usr/share/elasticsearch/data
    networks:
      - xinglin-net

  video-service:
    build:
      context: ./backend/video-service
    image: xinglin/video-service:1.0.0
    container_name: xinglin-video-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - rabbitmq
    environment:
      SERVER_PORT: 8082
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xinglin_video}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xinglin_mysql_pwd}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-xinglin_redis_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-xinglin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-xinglin_rabbit_pwd}
      JWT_SECRET: ${JWT_SECRET:-change_this_dev_secret_at_least_32_chars}
      OSS_ENABLED: ${OSS_ENABLED:-false}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-}
      OSS_PUBLIC_ENDPOINT: ${OSS_PUBLIC_ENDPOINT:-}
      OSS_PUBLIC_BASE_URL: ${OSS_PUBLIC_BASE_URL:-}
      OSS_BUCKET: ${OSS_BUCKET:-}
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_VIDEO_DIR: ${OSS_VIDEO_DIR:-videos}
      OSS_COVER_DIR: ${OSS_COVER_DIR:-covers}
      OSS_MAX_VIDEO_SIZE_MB: ${OSS_MAX_VIDEO_SIZE_MB:-1024}
      OSS_MAX_COVER_SIZE_MB: ${OSS_MAX_COVER_SIZE_MB:-10}
      UPLOAD_MAX_FILE_SIZE: ${UPLOAD_MAX_FILE_SIZE:-1024MB}
      UPLOAD_MAX_REQUEST_SIZE: ${UPLOAD_MAX_REQUEST_SIZE:-1024MB}
      TZ: Asia/Shanghai
    networks:
      - xinglin-net

  user-service:
    build:
      context: ./backend/user-service
    image: xinglin/user-service:1.0.0
    container_name: xinglin-user-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - rabbitmq
    environment:
      SERVER_PORT: 8081
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xinglin_video}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xinglin_mysql_pwd}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-xinglin_redis_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-xinglin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-xinglin_rabbit_pwd}
      JWT_SECRET: ${JWT_SECRET:-change_this_dev_secret_at_least_32_chars}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-yjyjocyer}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PHONE: ${ADMIN_PHONE:-13900000000}
      TZ: Asia/Shanghai
    networks:
      - xinglin-net

  forum-service:
    build:
      context: ./backend/forum-service
    image: xinglin/forum-service:1.0.0
    container_name: xinglin-forum-service
    restart: unless-stopped
    depends_on:
      - mysql
      - redis
      - rabbitmq
    environment:
      SERVER_PORT: 8085
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xinglin_video}
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-xinglin_mysql_pwd}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-xinglin_redis_pwd}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-xinglin}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-xinglin_rabbit_pwd}
      JWT_SECRET: ${JWT_SECRET:-change_this_dev_secret_at_least_32_chars}
      TZ: Asia/Shanghai
    networks:
      - xinglin-net

  frontend:
    build:
      context: ./frontend
    image: xinglin/frontend:1.0.0
    container_name: xinglin-frontend
    restart: unless-stopped
    depends_on:
      - video-service
      - user-service
      - forum-service
    volumes:
      - ./data/media:/data/media:ro
    ports:
      - "80:80"
    networks:
      - xinglin-net

networks:
  xinglin-net:
    driver: bridge
